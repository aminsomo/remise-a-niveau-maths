<body data-root="../" data-chapter="MATIERE/SLUG">
<main class="chapter">
  <header class="chapter-head">
    <p class="kicker">Matière · Thème</p>
    <h1>TITRE</h1>
    <p class="lead">Ce que tu sauras faire à la fin du chapitre.</p>
  </header>

  <section>
    <h2>1. Notion</h2>
    <div class="box def"><p class="box-title">Définition</p><p>…</p></div>
    <div class="box example"><p class="box-title">Exemple</p><p>…</p>
      <details class="solution"><summary>Solution</summary><p>…</p></details></div>
  </section>

  <section>
    <h2>2. Manipuler</h2>
    <div class="widget" id="w-demo">
      <p class="widget-title">Titre de l'animation</p>
      <p class="hint">Consigne.</p>
      <div class="controls"><label>a <input type="range" data-k="a" min="-3" max="3" step="0.1" value="1"> <output data-show="a"></output></label></div>
      <canvas class="plot"></canvas>
    </div>
  </section>

  <section>

      <div class="q" data-answer="0">

      </div>
    </div>
  </section>

  <section id="videos">
    <h2>Pour aller plus loin en vidéo</h2>
    <ul class="videos">
      <li><a href="https://www.youtube.com/results?search_query=…">Titre<small>Recherche YouTube</small></a></li>
    </ul>
  </section>
</main>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var w = document.getElementById('w-demo'), P;
  Course.onInput(w, function (v) {
    if (!P) P = Course.plot(w.querySelector('canvas'), { xmin: -5, xmax: 5, ymin: -5, ymax: 5 });
    P.draw = function (g) { g.fn(function (x) { return v.a * x; }, '--c1'); };
    P.redraw();
  });
});
</script>
